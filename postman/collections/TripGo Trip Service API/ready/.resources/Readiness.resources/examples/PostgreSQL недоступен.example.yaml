$kind: http-example
request:
  url: "{{baseUrl}}/ready"
  method: GET
  headers:
    Accept: application/json
  body:
    type: text
    content: ""
response:
  statusCode: 503
  statusText: Service Unavailable
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "unavailable"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "ok",
              "unavailable"
            ]
          }
        },
        "required": [
          "status"
        ]
      }
order: 2000
