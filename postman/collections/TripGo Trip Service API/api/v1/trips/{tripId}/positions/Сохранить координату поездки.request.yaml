$kind: http-request
description: Координаты разрешено добавлять только в активную поездку.
url: "{{baseUrl}}/api/v1/trips/:tripId/positions"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: tripId
    value: 44db80c4-f466-06b0-0895-0b43e2c1c46c
    disabled: false
    description: UUID поездки
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: json
  content: |-
    {
      "coordinates": {
        "latitude": 59.9343,
        "longitude": 30.3351
      },
      "recorded_at": "2026-09-01T10:05:00Z"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "coordinates": {
          "type": "object",
          "description": "Географические координаты WGS 84.",
          "properties": {
            "latitude": {
              "type": "number",
              "minimum": -90,
              "maximum": 90,
              "example": 59.9398,
              "format": "double"
            },
            "longitude": {
              "type": "number",
              "minimum": -180,
              "maximum": 180,
              "example": 30.3146,
              "format": "double"
            }
          },
          "required": [
            "latitude",
            "longitude"
          ]
        },
        "recorded_at": {
          "type": "string",
          "description": "Время фиксации координаты на мобильном устройстве.",
          "format": "date-time"
        }
      },
      "required": [
        "coordinates",
        "recorded_at"
      ]
    }
settings: {}
examples: ./.resources/Сохранить координату поездки.resources/examples
order: 1000
