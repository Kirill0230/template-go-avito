$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/trips/:tripId/positions"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  pathVariables:
    - key: tripId
      value: 44db80c4-f466-06b0-0895-0b43e2c1c46c
      disabled: false
      description: UUID поездки
  body:
    type: json
    content: |-
      {
        "coordinates": {
          "latitude": 59.9343,
          "longitude": 30.3351
        },
        "recorded_at": "2026-09-01T10:05:00Z"
      }
