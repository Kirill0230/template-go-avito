                  },
                  "longitude": {
                    "type": "number",
                    "minimum": -180,
                    "maximum": 180,
                    "example": 30.3146,
                    "format": "double"
                  }
                },
                "required": [
                  "latitude",
                  "longitude"
                ]
              },
              "recorded_at": {
                "type": "string",
                "description": "Время фиксации координаты на мобильном устройстве.",
                "format": "date-time"
              }
            },
            "required": [
              "coordinates",
              "recorded_at"
            ]
          },
          {
            "type": "object",
            "properties": {
              "id": {
                "type": "integer",
                "format": "int64"
              },
              "trip_id": {
                "type": "string",
                "format": "uuid"
              }
            },
            "required": [
              "id",
              "trip_id"
            ]
          }
        ]
      }
