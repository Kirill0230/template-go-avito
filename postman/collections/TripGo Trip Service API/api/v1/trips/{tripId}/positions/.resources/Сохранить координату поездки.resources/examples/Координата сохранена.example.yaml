  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "coordinates": {
          "latitude": 59.9398,
          "longitude": 30.3146
        },
        "recorded_at": "1967-05-06T21:51:07.934Z",
        "id": 113,
        "trip_id": "231439c7-2caf-79e3-35c0-4641a5fa4ff1"
      }
    $type: |-
      {
        "allOf": [
          {
            "type": "object",
            "properties": {
              "coordinates": {
                "type": "object",
                "description": "Географические координаты WGS 84.",
                "properties": {
                  "latitude": {
                    "type": "number",
                    "minimum": -90,
                    "maximum": 90,
                    "example": 59.9398,
